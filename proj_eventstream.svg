<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="streamBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180e03"/>
      <stop offset="50%" stop-color="#241405"/>
      <stop offset="100%" stop-color="#0d0701"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#streamBg)"/>

  <!-- Top App Bar -->
  <rect x="25" y="20" width="750" height="46" rx="8" fill="rgba(67, 34, 10, 0.45)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  <circle cx="50" cy="43" r="5" fill="#ef4444"/>
  <circle cx="66" cy="43" r="5" fill="#f59e0b"/>
  <circle cx="82" cy="43" r="5" fill="#10b981"/>
  <text x="110" y="48" fill="#ffedd5" font-family="'Outfit', sans-serif" font-size="13" font-weight="700">EVENT BROKER // HIGH-THROUGHPUT REALTIME PIPELINE</text>
  <rect x="635" y="29" width="125" height="28" rx="6" fill="rgba(249, 115, 22, 0.2)" stroke="rgba(249, 115, 22, 0.4)"/>
  <text x="697" y="47" fill="#fb923c" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle" font-weight="600">ZERO LATENCY</text>

  <!-- Left: Event Stream Visualizer -->
  <rect x="25" y="80" width="460" height="345" rx="14" fill="rgba(30, 16, 5, 0.75)" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1"/>
  <text x="45" y="112" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="15" font-weight="700">Partitioned Ring Buffer Topologies</text>
  <text x="45" y="132" fill="#fb923c" font-family="'Inter', sans-serif" font-size="12">Lock-free Ring Buffer | Zero-Copy DMA Dispatch</text>

  <!-- Stream Pipelines -->
  <g transform="translate(45, 155)">
    <!-- Topic 1 -->
    <rect x="0" y="0" width="80" height="36" rx="6" fill="rgba(249, 115, 22, 0.2)" stroke="#f97316"/>
    <text x="40" y="22" fill="#ffedd5" font-family="'Fira Code', monospace" font-size="10" text-anchor="middle">events.in</text>
    
    <path d="M 85 18 L 130 18" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3 3"/>
    
    <!-- Partition pills -->
    <rect x="135" y="0" width="60" height="36" rx="6" fill="#f97316"/>
    <text x="165" y="22" fill="#fff" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">P-0</text>
    <rect x="205" y="0" width="60" height="36" rx="6" fill="#ea580c"/>
    <text x="235" y="22" fill="#fff" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">P-1</text>
    <rect x="275" y="0" width="60" height="36" rx="6" fill="#c2410c"/>
    <text x="305" y="22" fill="#fff" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">P-2</text>

    <!-- Topic 2 -->
    <rect x="0" y="60" width="80" height="36" rx="6" fill="rgba(249, 115, 22, 0.2)" stroke="#f97316"/>
    <text x="40" y="82" fill="#ffedd5" font-family="'Fira Code', monospace" font-size="10" text-anchor="middle">telemetry</text>
    
    <path d="M 85 78 L 130 78" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3 3"/>
    
    <rect x="135" y="60" width="60" height="36" rx="6" fill="#f97316"/>
    <text x="165" y="82" fill="#fff" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">P-0</text>
    <rect x="205" y="60" width="60" height="36" rx="6" fill="#ea580c"/>
    <text x="235" y="82" fill="#fff" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">P-1</text>
    <rect x="275" y="60" width="60" height="36" rx="6" fill="#c2410c"/>
    <text x="305" y="82" fill="#fff" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">P-2</text>

    <!-- Consumers -->
    <path d="M 340 18 L 380 48" stroke="#34d399" stroke-width="2"/>
    <path d="M 340 78 L 380 48" stroke="#34d399" stroke-width="2"/>
    <circle cx="395" cy="48" r="16" fill="#10b981"/>
    <text x="395" y="52" fill="#fff" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Sink</text>
  </g>

  <!-- Live Pulse Waves -->
  <g transform="translate(45, 280)">
    <text x="0" y="0" fill="#fed7aa" font-family="'Inter', sans-serif" font-size="11" font-weight="600">CONTINUOUS CONSUMER COMMIT RATE</text>
    <path d="M 0 50 Q 30 10, 60 50 T 120 20 T 180 60 T 240 10 T 300 40 T 360 15 T 410 40" fill="none" stroke="#f97316" stroke-width="3"/>
  </g>

  <!-- Right Cards -->
  <rect x="500" y="80" width="275" height="162" rx="14" fill="rgba(30, 16, 5, 0.75)" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1"/>
  <text x="520" y="112" fill="#fb923c" font-family="'Outfit', sans-serif" font-size="13" font-weight="700">PEAK INGESTION</text>
  <text x="520" y="152" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="32" font-weight="800">5.6M <tspan font-size="16" fill="#fbbf24">msg/s</tspan></text>
  <text x="520" y="174" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">End-to-end latency &lt; 2.1ms</text>
  <rect x="520" y="194" width="235" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
  <rect x="520" y="194" width="220" height="6" rx="3" fill="url(#orangeGrad)"/>
  <text x="520" y="222" fill="#34d399" font-family="'Inter', sans-serif" font-size="11">● Exactly-once semantics verified</text>

  <rect x="500" y="258" width="275" height="167" rx="14" fill="rgba(30, 16, 5, 0.75)" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1"/>
  <text x="520" y="290" fill="#fb923c" font-family="'Outfit', sans-serif" font-size="13" font-weight="700">COMPACTION SAVINGS</text>
  <text x="520" y="330" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="32" font-weight="800">76.4<tspan font-size="16" fill="#f97316">%</tspan></text>
  <text x="520" y="356" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">ZSTD dictionary tiered compression</text>
  <text x="520" y="386" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="11">Rust + Tokio Async Engine</text>
</svg>
