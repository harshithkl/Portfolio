  <!-- Right Cards -->
  <rect x="500" y="80" width="275" height="162" rx="14" fill="rgba(0, 24, 36, 0.75)" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1"/>
  <text x="520" y="112" fill="#02c39a" font-family="'Outfit', sans-serif" font-size="13" font-weight="700">AGGREGATE STORAGE</text>
  <text x="520" y="152" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="32" font-weight="800">4.2 <tspan font-size="16" fill="#38bdf8">Petabytes</tspan></text>
  <text x="520" y="174" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Encrypted at rest (AES-256-GCM)</text>
  <rect x="520" y="194" width="235" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
  <rect x="520" y="194" width="200" height="6" rx="3" fill="url(#tealGrad)"/>
  <text x="520" y="222" fill="#34d399" font-family="'Inter', sans-serif" font-size="11">● 99.999999999% Durability guarantee</text>

  <rect x="500" y="258" width="275" height="167" rx="14" fill="rgba(0, 24, 36, 0.75)" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1"/>
  <text x="520" y="290" fill="#02c39a" font-family="'Outfit', sans-serif" font-size="13" font-weight="700">TRANSFER SPEED</text>
  <text x="520" y="330" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="32" font-weight="800">1.82 <tspan font-size="16" fill="#02c39a">GB/s</tspan></text>
  <text x="520" y="356" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Concurrent chunked peer streaming</text>
  <text x="520" y="386" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="11">S3-Compatible API Gateway</text>
</svg>
