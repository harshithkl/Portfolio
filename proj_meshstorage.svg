<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="meshBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051923"/>
      <stop offset="50%" stop-color="#003554"/>
      <stop offset="100%" stop-color="#001824"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#05668d"/>
      <stop offset="50%" stop-color="#02c39a"/>
      <stop offset="100%" stop-color="#f0f3bd"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#meshBg)"/>

  <!-- Top App Bar -->
  <rect x="25" y="20" width="750" height="46" rx="8" fill="rgba(2, 62, 138, 0.3)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  <circle cx="50" cy="43" r="5" fill="#ef4444"/>
  <circle cx="66" cy="43" r="5" fill="#f59e0b"/>
  <circle cx="82" cy="43" r="5" fill="#10b981"/>
  <text x="110" y="48" fill="#e0fbfc" font-family="'Outfit', sans-serif" font-size="13" font-weight="700">DISTRIBUTED STORAGE // P2P ERASURE CODED MESH</text>
  <rect x="635" y="29" width="125" height="28" rx="6" fill="rgba(2, 195, 154, 0.2)" stroke="rgba(2, 195, 154, 0.4)"/>
  <text x="697" y="47" fill="#02c39a" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle" font-weight="600">ZERO DATA LOSS</text>

  <!-- Left: Shard Grid -->
  <rect x="25" y="80" width="460" height="345" rx="14" fill="rgba(0, 24, 36, 0.75)" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1"/>
  <text x="45" y="112" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="15" font-weight="700">Reed-Solomon (8+4) Erasure Shards</text>
  <text x="45" y="132" fill="#02c39a" font-family="'Inter', sans-serif" font-size="12">12 Independent Peer Nodes with SHA-256 Merkle Verification</text>

  <!-- 12 Shard Blocks (3 rows of 4) -->
  <g transform="translate(45, 150)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="95" height="65" rx="8" fill="rgba(2, 195, 154, 0.15)" stroke="#02c39a" stroke-width="1.5"/>
    <text x="47" y="28" fill="#e0fbfc" font-family="'Fira Code', monospace" font-size="11" text-anchor="middle">Shard 01</text>
    <text x="47" y="48" fill="#02c39a" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Validated ✓</text>

    <rect x="105" y="0" width="95" height="65" rx="8" fill="rgba(2, 195, 154, 0.15)" stroke="#02c39a" stroke-width="1.5"/>
    <text x="152" y="28" fill="#e0fbfc" font-family="'Fira Code', monospace" font-size="11" text-anchor="middle">Shard 02</text>
    <text x="152" y="48" fill="#02c39a" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Validated ✓</text>

    <rect x="210" y="0" width="95" height="65" rx="8" fill="rgba(2, 195, 154, 0.15)" stroke="#02c39a" stroke-width="1.5"/>
    <text x="257" y="28" fill="#e0fbfc" font-family="'Fira Code', monospace" font-size="11" text-anchor="middle">Shard 03</text>
    <text x="257" y="48" fill="#02c39a" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Validated ✓</text>

    <rect x="315" y="0" width="95" height="65" rx="8" fill="rgba(2, 195, 154, 0.15)" stroke="#02c39a" stroke-width="1.5"/>
    <text x="362" y="28" fill="#e0fbfc" font-family="'Fira Code', monospace" font-size="11" text-anchor="middle">Shard 04</text>
    <text x="362" y="48" fill="#02c39a" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Validated ✓</text>

    <!-- Row 2 -->
    <rect x="0" y="75" width="95" height="65" rx="8" fill="rgba(2, 195, 154, 0.15)" stroke="#02c39a" stroke-width="1.5"/>
    <text x="47" y="103" fill="#e0fbfc" font-family="'Fira Code', monospace" font-size="11" text-anchor="middle">Shard 05</text>
    <text x="47" y="123" fill="#02c39a" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Validated ✓</text>

    <rect x="105" y="75" width="95" height="65" rx="8" fill="rgba(2, 195, 154, 0.15)" stroke="#02c39a" stroke-width="1.5"/>
    <text x="152" y="103" fill="#e0fbfc" font-family="'Fira Code', monospace" font-size="11" text-anchor="middle">Shard 06</text>
    <text x="152" y="123" fill="#02c39a" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Validated ✓</text>

    <rect x="210" y="75" width="95" height="65" rx="8" fill="rgba(2, 195, 154, 0.15)" stroke="#02c39a" stroke-width="1.5"/>
    <text x="257" y="103" fill="#e0fbfc" font-family="'Fira Code', monospace" font-size="11" text-anchor="middle">Shard 07</text>
    <text x="257" y="123" fill="#02c39a" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Validated ✓</text>

    <rect x="315" y="75" width="95" height="65" rx="8" fill="rgba(2, 195, 154, 0.15)" stroke="#02c39a" stroke-width="1.5"/>
    <text x="362" y="103" fill="#e0fbfc" font-family="'Fira Code', monospace" font-size="11" text-anchor="middle">Shard 08</text>
    <text x="362" y="123" fill="#02c39a" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Validated ✓</text>

    <!-- Parity Row 3 -->
    <rect x="0" y="150" width="95" height="65" rx="8" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="47" y="178" fill="#e0fbfc" font-family="'Fira Code', monospace" font-size="11" text-anchor="middle">Parity P1</text>
    <text x="47" y="198" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">ECC Ready</text>

    <rect x="105" y="150" width="95" height="65" rx="8" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="152" y="178" fill="#e0fbfc" font-family="'Fira Code', monospace" font-size="11" text-anchor="middle">Parity P2</text>
    <text x="152" y="198" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">ECC Ready</text>

    <rect x="210" y="150" width="95" height="65" rx="8" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1.5"/>
