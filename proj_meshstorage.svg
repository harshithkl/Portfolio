    <text x="257" y="198" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">ECC Ready</text>

    <rect x="315" y="150" width="95" height="65" rx="8" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="362" y="178" fill="#e0fbfc" font-family="'Fira Code', monospace" font-size="11" text-anchor="middle">Parity P4</text>
    <text x="362" y="198" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">ECC Ready</text>
