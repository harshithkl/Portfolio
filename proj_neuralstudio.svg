<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a1f"/>
      <stop offset="50%" stop-color="#140f2d"/>
      <stop offset="100%" stop-color="#05030d"/>
    </linearGradient>
    <linearGradient id="aiNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#aiBg)"/>

  <!-- Glowing Aura -->
  <circle cx="400" cy="225" r="180" fill="rgba(139, 92, 246, 0.12)" filter="blur(30px)"/>

  <!-- Top App Bar -->
  <rect x="25" y="20" width="750" height="46" rx="8" fill="rgba(30, 27, 75, 0.5)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  <circle cx="50" cy="43" r="5" fill="#ef4444"/>
  <circle cx="66" cy="43" r="5" fill="#f59e0b"/>
  <circle cx="82" cy="43" r="5" fill="#10b981"/>
  <text x="110" y="48" fill="#f5d0fe" font-family="'Outfit', sans-serif" font-size="13" font-weight="700">NEURAL ENGINE // SEMANTIC CODE EMBEDDINGS &amp; LLM PIPELINE</text>
  <rect x="620" y="29" width="140" height="28" rx="6" fill="rgba(236, 72, 153, 0.18)" stroke="rgba(236, 72, 153, 0.3)"/>
  <text x="690" y="47" fill="#f472b6" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle" font-weight="600">QDRANT VECTOR DB</text>

  <!-- Left: Code Embeddings Vector Graph -->
  <rect x="25" y="80" width="460" height="345" rx="14" fill="rgba(19, 14, 43, 0.75)" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1"/>
  <text x="45" y="112" fill="#fdf4ff" font-family="'Outfit', sans-serif" font-size="15" font-weight="700">Multi-Dimensional AST Vector Space</text>
  <text x="45" y="132" fill="#a855f7" font-family="'Inter', sans-serif" font-size="12">Cosine Similarity: 0.942 | 1536 Dimensions</text>

  <!-- Neural Network Nodes & Links -->
  <g stroke="rgba(168, 85, 247, 0.35)" stroke-width="1.5">
    <line x1="120" y1="200" x2="230" y2="170"/>
    <line x1="120" y1="200" x2="210" y2="280"/>
    <line x1="120" y1="200" x2="160" y2="350"/>
    <line x1="230" y1="170" x2="330" y2="200"/>
    <line x1="230" y1="170" x2="310" y2="290"/>
    <line x1="210" y1="280" x2="330" y2="200"/>
    <line x1="210" y1="280" x2="380" y2="320"/>
    <line x1="160" y1="350" x2="280" y2="370"/>
    <line x1="280" y1="370" x2="380" y2="320"/>
    <line x1="330" y1="200" x2="420" y2="240"/>
    <line x1="380" y1="320" x2="420" y2="240"/>
  </g>

  <!-- Node Dots -->
  <circle cx="120" cy="200" r="14" fill="#8b5cf6" stroke="#c084fc" stroke-width="2"/>
  <text x="120" y="204" fill="#ffffff" font-family="'Fira Code', monospace" font-size="9" text-anchor="middle" font-weight="700">AST</text>

  <circle cx="230" cy="170" r="12" fill="#ec4899" stroke="#f472b6" stroke-width="2"/>
  <circle cx="210" cy="280" r="16" fill="#3b82f6" stroke="#60a5fa" stroke-width="2"/>
  <text x="210" y="284" fill="#ffffff" font-family="'Fira Code', monospace" font-size="9" text-anchor="middle" font-weight="700">EMB</text>

  <circle cx="160" cy="350" r="10" fill="#a855f7"/>
  <circle cx="280" cy="370" r="11" fill="#06b6d4"/>
  <circle cx="310" cy="290" r="9" fill="#e879f9"/>
  <circle cx="330" cy="200" r="15" fill="#8b5cf6" stroke="#d8b4fe" stroke-width="2"/>
  <circle cx="380" cy="320" r="13" fill="#ec4899" stroke="#f472b6" stroke-width="2"/>
  
  <circle cx="420" cy="240" r="20" fill="url(#aiNeon)" stroke="#ffffff" stroke-width="2"/>
  <text x="420" y="244" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="10" text-anchor="middle" font-weight="800">MATCH</text>

  <!-- Query Pill -->
  <rect x="45" y="380" width="410" height="32" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)"/>
  <text x="60" y="401" fill="#e2e8f0" font-family="'Fira Code', monospace" font-size="11">query: "find zero-copy memory buffer reader" → 12ms</text>

  <!-- Right: Semantic Inference Cards -->
  <rect x="500" y="80" width="275" height="162" rx="14" fill="rgba(19, 14, 43, 0.75)" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1"/>
  <text x="520" y="112" fill="#c084fc" font-family="'Outfit', sans-serif" font-size="13" font-weight="700">RETRIEVAL METRICS</text>
  <text x="520" y="152" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="32" font-weight="800">12.4<tspan font-size="16" fill="#f472b6"> ms</tspan></text>
  <text x="520" y="174" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Dense Retrieval Latency (HNSW)</text>
  <rect x="520" y="194" width="235" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
  <rect x="520" y="194" width="215" height="6" rx="3" fill="url(#aiNeon)"/>
  <text x="520" y="222" fill="#34d399" font-family="'Inter', sans-serif" font-size="11">● 99.4% Recall Accuracy on SWE-Bench</text>

  <rect x="500" y="258" width="275" height="167" rx="14" fill="rgba(19, 14, 43, 0.75)" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1"/>
  <text x="520" y="290" fill="#c084fc" font-family="'Outfit', sans-serif" font-size="13" font-weight="700">AUTOMATED SYNTHESIS</text>
  <text x="520" y="322" fill="#ffffff" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Context Window Compression</text>
  <text x="520" y="342" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">AST Tree Slicing reduced tokens by 68%</text>
  <rect x="520" y="360" width="235" height="42" rx="6" fill="rgba(255,255,255,0.04)"/>
  <text x="535" y="386" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="11">fn parse_ast_tokens() → Result</text>
</svg>
