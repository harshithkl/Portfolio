<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.75)"/>
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowViolet" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>

  <!-- Glowing background orbs -->
  <circle cx="680" cy="90" r="140" fill="rgba(6, 182, 212, 0.12)" filter="url(#glowCyan)"/>
  <circle cx="120" cy="380" r="160" fill="rgba(139, 92, 246, 0.1)" filter="url(#glowViolet)"/>

  <!-- Top App Header -->
  <rect x="30" y="24" width="740" height="48" rx="10" fill="rgba(30, 41, 59, 0.5)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  <circle cx="56" cy="48" r="6" fill="#ef4444"/>
  <circle cx="74" cy="48" r="6" fill="#f59e0b"/>
  <circle cx="92" cy="48" r="6" fill="#10b981"/>
  <text x="120" y="53" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="13" font-weight="600">GATEWAY_CORE // RATE-LIMITER-PROXY v3.1</text>
  <rect x="630" y="34" width="124" height="26" rx="13" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.3)"/>
  <circle cx="646" cy="47" r="4" fill="#10b981"/>
  <text x="658" y="51" fill="#34d399" font-family="'Inter', sans-serif" font-size="11" font-weight="600">1.4M REQ/SEC</text>

  <!-- Left Card: Token Bucket Topology -->
  <rect x="30" y="88" width="450" height="336" rx="14" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
  <text x="56" y="122" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="16" font-weight="700">Token Bucket Queue &amp; Edge Sync</text>
  <text x="56" y="142" fill="#64748b" font-family="'Inter', sans-serif" font-size="12">Sliding Window Leaky Bucket Algorithm (Redis + Memory)</text>

  <!-- Flow Nodes -->
  <g transform="translate(56, 165)">
    <!-- Ingress Node -->
    <rect x="0" y="30" width="100" height="60" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="50" y="56" fill="#e2e8f0" font-family="'Fira Code', monospace" font-size="11" text-anchor="middle" font-weight="600">Client</text>
    <text x="50" y="74" fill="#60a5fa" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">HTTP/2, gRPC</text>

    <!-- Arrow 1 -->
    <path d="M 100 60 L 138 60" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4 2"/>
    <polygon points="144,60 136,56 136,64" fill="#06b6d4"/>

    <!-- Gateway Core Node -->
    <rect x="146" y="10" width="120" height="100" rx="10" fill="rgba(6, 182, 212, 0.1)" stroke="#06b6d4" stroke-width="2"/>
    <text x="206" y="42" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="13" text-anchor="middle" font-weight="700">Edge Gateway</text>
    <rect x="162" y="55" width="88" height="18" rx="4" fill="rgba(255,255,255,0.06)"/>
    <text x="206" y="68" fill="#a5f3fc" font-family="'Fira Code', monospace" font-size="10" text-anchor="middle">Tokens: 98%</text>
    <text x="206" y="94" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">p99 = 0.42ms</text>

    <!-- Arrow 2 to Upstream -->
    <path d="M 266 45 L 306 35" stroke="#10b981" stroke-width="2"/>
    <polygon points="312,33 303,32 305,39" fill="#10b981"/>
    
    <!-- Arrow 3 to Drop/Reject -->
    <path d="M 266 75 L 306 85" stroke="#f43f5e" stroke-width="2" stroke-dasharray="3 3"/>
    <polygon points="312,87 305,82 303,89" fill="#f43f5e"/>

    <!-- Upstream Box -->
    <rect x="314" y="15" width="80" height="38" rx="6" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1"/>
    <text x="354" y="38" fill="#6ee7b7" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle" font-weight="600">200 OK</text>

    <!-- Reject Box -->
    <rect x="314" y="68" width="80" height="38" rx="6" fill="rgba(244, 63, 94, 0.15)" stroke="#f43f5e" stroke-width="1"/>
    <text x="354" y="91" fill="#fda4af" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle" font-weight="600">429 Retry</text>
  </g>

  <!-- Live Throughput Sparkline -->
  <g transform="translate(56, 305)">
    <text x="0" y="0" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" font-weight="600">LIVE TRAFFIC INGRESS &amp; BURST BUFFER</text>
    <path d="M 0 65 Q 40 20, 80 50 T 160 30 T 240 70 T 320 20 T 390 40 L 390 75 L 0 75 Z" fill="rgba(6, 182, 212, 0.15)"/>
    <path d="M 0 65 Q 40 20, 80 50 T 160 30 T 240 70 T 320 20 T 390 40" fill="none" stroke="#06b6d4" stroke-width="2.5"/>
  </g>

  <!-- Right Cards: Telemetry Metrics -->
  <rect x="500" y="88" width="270" height="158" rx="14" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
  <text x="522" y="120" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12" font-weight="600">GLOBAL LATENCY (p99)</text>
  <text x="522" y="162" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="34" font-weight="800">0.38<tspan font-size="18" fill="#38bdf8"> ms</tspan></text>
  <rect x="522" y="184" width="226" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
  <rect x="522" y="184" width="195" height="6" rx="3" fill="url(#cyanGrad)"/>
  <text x="522" y="210" fill="#34d399" font-family="'Inter', sans-serif" font-size="11">▲ 42% faster than Envoy baseline</text>

  <rect x="500" y="266" width="270" height="158" rx="14" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
  <text x="522" y="298" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12" font-weight="600">ACTIVE EDGE POOLS</text>
  <text x="522" y="340" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="34" font-weight="800">48<tspan font-size="18" fill="#a78bfa"> / 48</tspan></text>
  <rect x="522" y="362" width="226" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
  <rect x="522" y="362" width="226" height="6" rx="3" fill="url(#violetGrad)"/>
  <text x="522" y="388" fill="#a78bfa" font-family="'Inter', sans-serif" font-size="11">● Multi-region Raft consensus syncd</text>
</svg>
